<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Orbit Path -->
  <ellipse cx="32" cy="32" rx="28" ry="12" stroke="url(#orbitGrad)" stroke-width="2" stroke-dasharray="4 2" transform="rotate(-30 32 32)" opacity="0.7"/>
  <!-- Central Globe -->
  <circle cx="32" cy="32" r="14" fill="url(#bodyGrad)" stroke="#3b82f6" stroke-width="2"/>
  <path d="M22 32a10 10 0 0 0 16 7M26 24a10 10 0 0 1 12 3" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Satellite Body -->
  <g transform="translate(42, 14) rotate(-30)">
    <rect x="-4" y="-3" width="8" height="6" rx="1.5" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5"/>
    <!-- Solar Panels -->
    <rect x="-12" y="-2" width="6" height="4" rx="0.5" fill="#3b82f6"/>
    <rect x="6" y="-2" width="6" height="4" rx="0.5" fill="#3b82f6"/>
    <!-- Signal Beam -->
    <path d="M0 4L-8 16M0 4L8 16" stroke="#10b981" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
